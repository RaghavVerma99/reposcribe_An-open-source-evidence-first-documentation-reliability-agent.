# Render Blueprint: one web service, one Docker image, no external database.
# The FastAPI process serves the built Vite bundle and the /api/v1 routes.
services:
  - type: web
    name: reposcribe
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    # Free instances have an ephemeral disk. For durable state, use a paid
    # instance with a disk mounted at /var/data and set:
    #   REPOSCRIBE_DB_PATH=/var/data/reposcribe.db
    #   WORKSPACE_ROOT=/var/data/workspaces
    envVars:
      - key: APP_ENV
        value: production
      - key: MODEL_PROVIDER
        value: local_demo
      - key: WORKSPACE_ROOT
        value: /tmp/reposcribe-workspaces
      - key: REPOSCRIBE_DB_PATH
        value: /tmp/reposcribe/state.db
      - key: SESSION_SECRET
        generateValue: true
      - key: REPOSCRIBE_LOG_LEVEL
        value: INFO
      - key: AUDIT_TIMEOUT_SECONDS
        value: "60"
      # A public demo should not exhaust the default eight slots in one sitting.
      - key: MAX_CONCURRENT_WORKSPACES
        value: "32"
